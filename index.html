<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fms-notes/favicon.svg" />
    <link rel="apple-touch-icon" href="/fms-notes/icon-192.png" />
    <link rel="manifest" href="/fms-notes/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="FMS Notes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#66001f" />
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      // Keep in sync with src/lib/theme.js.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#17100f' : '#66001f';
      })();
    </script>
    <meta name="description" content="A free, student-run library of class notes, slides and past papers for the FMS Delhi MBA Executive programme. Anyone in the batch can upload — all it takes is a Google sign-in." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>FMS Notes — MBA Executive Class Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
